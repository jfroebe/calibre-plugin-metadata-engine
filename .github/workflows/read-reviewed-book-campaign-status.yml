          """Poll PostgreSQL for authorized acceptance jobs."""
          
          import argparse
          import base64
          import logging
          import os
          import signal
          from threading import Event
          
          import psycopg
          
          LOG = logging.getLogger(__name__)
          
          
          def run_lookup(db, runner, job_id, token, endpoint, *, opener=None, cover_opener=None):
              """Gather and store verified provider evidence under the current job lease."""
              from metadata_queue_cover import allowed_cover, fetch_cover
              from metadata_queue_provider import LeaseProviders, lookup
              from metadata_queue_quality import assess, replacement
              from psycopg.types.json import Jsonb
          
              lease = (runner, job_id, token)
              if not endpoint:
                  raise RuntimeError("No test engine configured for provider lookups")
              inputs = db.execute(
                  "SELECT metadata_queue.lookup_input(%s,%s,%s)", lease
              ).fetchone()[0]
              if inputs is None:
                  # A pause can block provider access while still permitting a fenced finish.
                  db.execute(
                      "SELECT metadata_queue.finish(%s,%s,%s,'retry','input_unavailable')", lease
                  )
                  return
              access = LeaseProviders(db, *lease)
              options = {"opener": opener} if opener is not None else {}
              evidence = lookup(
                  endpoint,
                  inputs["original"],
                  inputs["providers"],
                  5,
                  access,
                  access.reserve,
                  **options,
              )
              candidates = []
              for result in evidence["candidates"]:
                  payload = dict(result["payload"])
                  if payload.get("source_id"):
                      identifiers = payload.get("identifiers")
                      payload["identifiers"] = {
                          **(identifiers if isinstance(identifiers, dict) else {}),
                          f"metadata_engine_{result['provider']}": str(payload["source_id"]),
                      }
                  try:
                      scores = assess(payload)
                  except (AttributeError, TypeError, ValueError):
                      continue
                  candidates.append(dict(result, payload=payload, field_scores=scores))
              candidates.sort(key=lambda row: sum(row["field_scores"].values()), reverse=True)
              best = candidates[0] if candidates else None
              if best:
                  original = inputs["original"]
                  original_artwork = inputs["original_cover"]
                  processed = any(
                      name.startswith("metadata_engine_") and value
                      for name, value in original.get("identifiers", {}).items()
                  )
                  artwork = None
                  attempted = set()
                  for candidate in candidates:
                      provider = candidate["provider"]
                      url = candidate["payload"].get("cover_url")
                      if provider in attempted or not allowed_cover(url):
                          continue
                      attempted.add(provider)
                      if not db.execute(
                          "SELECT metadata_queue.reserve_artwork(%s,%s,%s,%s)",
                          (*lease, provider),
                      ).fetchone()[0]:
                          continue
                      downloaded = fetch_cover(url, 5, opener=cover_opener)
                      if not downloaded:
                          continue
                      if not artwork:
                          best, artwork = candidate, downloaded
                      if (
                          not processed
                          or not original_artwork
                          or (downloaded["sha256"] == original_artwork["sha256"])
                      ):
                          best, artwork = candidate, downloaded
                          break
                  candidate_record = dict(
                      source=best["provider"],
                      payload=best["payload"],
                      field_scores=best["field_scores"],
                  )
                  if artwork:
                      candidate_record["field_scores"] = assess(
                          best["payload"], (artwork["width"], artwork["height"])
                      )
                      candidate_record["cover"] = dict(
                          artwork, bytes=base64.b64encode(artwork["bytes"]).decode("ascii")
                      )
                  original_size = (
                      (original_artwork["width"], original_artwork["height"])
                      if original_artwork
                      else None
                  )
                  safe_artwork = artwork and (
                      not original_artwork or artwork["sha256"] == original_artwork["sha256"]
                  )
                  if safe_artwork:
                      original_scores = assess(original, original_size)
                      recommend, reason = replacement(
                          original,
                          best["payload"],
                          original_scores,
                          candidate_record["field_scores"],
                          edition_verified=True,
                      )
                      comparable, _ = replacement(
                          original,
                          best["payload"],
                          original_scores,
                          candidate_record["field_scores"],
                          edition_verified=True,
                          allow_equal=True,
                      )
                  else:
                      recommend, reason = False, "cover_and_replacement_unverified"
                      comparable = False
                  candidate_record["replacement_assessment"] = {
                      "recommended": recommend,
                      "reason": reason,
                  }
                  candidate = Jsonb(candidate_record)
                  # A previously unmarked book can pass lookup acceptance with verified
                  # metadata and artwork. A replacement remains a separate decision.
                  if artwork and (not processed or comparable):
                      outcome, reason = "passed", None
                  else:
                      outcome = "needs_review"
              else:
                  candidate = None
                  temporary = {"transient", "rate_limited"}
                  if temporary.intersection(evidence["attempts"].values()):
                      outcome, reason = "retry", "provider_unavailable"
                  elif evidence["work_sources"]:
                      outcome, reason = "needs_review", "work_found_edition_unverified"
                  else:
                      outcome, reason = "needs_review", "no_verified_edition"
              db.execute(
                  "SELECT metadata_queue.finish_lookup(%s,%s,%s,%s,%s,%s,%s)",
                  (*lease, outcome, reason, Jsonb(evidence["attempts"]), candidate),
              )
          
          
          def work(dsn, runner, stop, once):
              """Heartbeat, recover expired leases and process synthetic work."""
              while not stop.is_set():
                  try:
                      with psycopg.connect(dsn, autocommit=True, connect_timeout=5) as db:
                          while not stop.is_set():
                              allowed = db.execute(
                                  "SELECT metadata_queue.heartbeat(%s)", (runner,)
                              ).fetchone()[0]
                              if allowed:
                                  db.execute("SELECT metadata_queue.recover(%s)", (runner,))
                                  # PostgreSQL decides which campaigns this worker may claim.
                                  job = db.execute(
                                      "SELECT * FROM metadata_queue.claim(%s)", (runner,)
                                  ).fetchone()
                                  if job is not None:
                                      job_id, token, synthetic = job
                                      if synthetic:
                                          db.execute(
                                              "SELECT metadata_queue.finish(%s,%s,%s,'passed')",
                                              (runner, job_id, token),
                                          )
                                      else:
                                          run_lookup(
                                              db,
                                              runner,
                                              job_id,
                                              token,
                                              os.getenv("METADATA_QUEUE_TEST_ENGINE"),
                                          )
                              if once:
                                  return
                              stop.wait(3 if allowed else 10)
                  except psycopg.OperationalError:
                      if once:
                          raise
                      LOG.warning("PostgreSQL unavailable; will reconnect")
                      stop.wait(15)
          
          
          def main():
              """Run the service without changing runner desired state on startup."""
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--runner", required=True)
              parser.add_argument("--once", action="store_true")
              args = parser.parse_args()
              logging.basicConfig(level=logging.INFO)
              stop = Event()
              for signum in (signal.SIGTERM, signal.SIGINT):
                  signal.signal(signum, lambda *_: stop.set())
              work(os.environ["METADATA_QUEUE_DSN"], args.runner, stop, args.once)
          
          
          if __name__ == "__main__":
              main()
          PYTHON
