          """Score stored book evidence and block protected-field regressions."""
          
          import re
          
          if __package__:
              from .metadata_queue_provider import edition_ids
          else:
              from metadata_queue_provider import edition_ids
          
          
          def assess(payload, cover=None):
              """Return deterministic completeness scores totaling at most 100."""
              description = re.sub(r"<[^>]+>", " ", payload.get("description") or "")
              return {
                  "title": 8 if payload.get("title") else 0,
                  "authors": 10 if payload.get("authors") else 0,
                  "identifiers": 12 if payload.get("identifiers") or edition_ids(payload) else 0,
                  "series": 10 if payload.get("series") else 0,
                  "volume": 5 if series(payload)[1] is not None else 0,
                  "description": min(15, len(description.split()) // 8),
                  "publication": sum(
                      3
                      for left, right in (
                          ("publishers", "publisher"),
                          ("pubdate", "published_year"),
                          ("languages", "language"),
                      )
                      if payload.get(left) or payload.get(right)
                  ),
                  "tags": min(
                      10,
                      2
                      * len(
                          {
                              tag.casefold()
                              for key in ("tags", "genres")
                              for tag in payload.get(key) or []
                              if tag.strip()
                          }
                      ),
                  ),
                  "warnings": 8 if payload.get("content_warnings") else 0,
                  "cover": min(10, min(cover) // 100) if cover else 0,
                  "provenance": 3 if payload.get("field_provenance") else 0,
              }
          
          
          def series(payload):
              """Read both the Calibre baseline and provider series representations."""
              name = payload.get("series")
              if isinstance(name, list):
                  name = next(iter(name), None)
              if isinstance(name, dict):
                  index = name.get("index", name.get("position", name.get("number")))
                  return name.get("name") or name.get("title") or name.get("series"), index
              return name, payload.get("series_index") if name else None
          
          
          def replacement(
              original,
              candidate,
              original_scores,
              candidate_scores,
              edition_verified,
              *,
              allow_equal=False,
          ):
              """Explain whether an edition-verified candidate protects the original."""
              if not edition_verified:
                  return False, "edition_unverified"
              for field in ("authors", "identifiers", "series", "volume", "description", "cover"):
                  if candidate_scores[field] < original_scores[field]:
                      return False, f"protected_field_regression:{field}"
              if original.get("authors") is not None and original["authors"] != candidate.get(
                  "authors"
              ):
                  return False, "protected_field_changed:authors"
              if series(original)[0] and series(original) != series(candidate):
                  return False, "protected_field_changed:series"
              for scheme, value in original.get("identifiers", {}).items():
                  if (candidate.get("identifiers") or {}).get(scheme) == value:
                      continue
                  expected = edition_ids({"identifiers": {scheme: value}})
                  if not expected or not expected <= edition_ids(candidate):
                      return False, "protected_identifier_changed"
              improvement = sum(candidate_scores.values()) - sum(original_scores.values())
              if allow_equal and improvement == 0:
                  return True, "equal_score_with_protected_fields_preserved"
              if improvement <= 0:
                  return False, "quality_not_higher"
              return True, "higher_score_with_protected_fields_preserved"
