name: Analyze submitted retry evidence
on:
  push:
    branches: [deploy/calibre-library-acceptance]
    paths: [.github/workflows/check-review-retry-status.yml]
permissions:
  contents: read
jobs:
  status:
    runs-on: [self-hosted, linux, x64, docker-build, chatgpt-build-02]
    timeout-minutes: 2
    steps:
      - name: Read aggregate retry readiness
        run: |
          set -euo pipefail
          test "$(hostname -s)" = chatgpt-build-02
          ssh -o BatchMode=yes -o ConnectTimeout=5 root@192.168.0.59 'file=$(mktemp); trap "rm -f -- $file" EXIT; cat > "$file"; bash "$file" </dev/null' <<'REMOTE'
          set -euo pipefail
          source=""
          while read -r container; do
            if docker port "$container" 5432/tcp 2>/dev/null | grep -q ':5432$'; then
              test -z "$source"
              source="$container"
            fi
          done < <(docker ps --format '{{.ID}}')
          test -n "$source"
          db_user="$(docker exec "$source" sh -c 'printf "%s" "${POSTGRES_USER:-postgres}"')"
          docker exec -i "$source" psql -qXAt -v ON_ERROR_STOP=1 -U "$db_user" -d metadata_test <<'SQL'
          BEGIN READ ONLY;
          SELECT 'retry_requests',state,count(*),count(DISTINCT media_id),
            count(DISTINCT media_id) FILTER (WHERE jsonb_array_length(coalesce(details->'urls','[]'))>0)
          FROM metadata_review.work_requests WHERE kind='retry' GROUP BY state ORDER BY state;
          SELECT 'campaigns',state,count(*) FROM metadata_queue.campaigns WHERE NOT synthetic GROUP BY state ORDER BY state;
          SELECT 'eligible_retry_books',count(DISTINCT w.media_id) FROM metadata_review.work_requests w
            JOIN metadata_queue.jobs j ON j.media_id=w.media_id
            JOIN metadata_queue.campaigns c ON c.id=j.campaign_id
            WHERE w.kind='retry' AND w.state='deferred' AND c.state='running' AND metadata_queue.approval_valid(c)
              AND j.state IN ('pending','retry_wait','leased');
          WITH refs AS (
            SELECT w.media_id, lower(split_part(split_part(u->>'normalized','://',2),'/',1)) AS host,
                   u->>'normalized' AS url
            FROM metadata_review.work_requests w CROSS JOIN LATERAL jsonb_array_elements(coalesce(details->'urls','[]')) u
            WHERE w.kind='retry' AND w.state='deferred'
          ), kinds AS (
            SELECT media_id,CASE
              WHEN host LIKE '%amazon.%' AND url ~ '/(dp|gp/product)/[A-Za-z0-9]{10}' THEN 'amazon_edition'
              WHEN host LIKE '%goodreads.com' AND url ~ '/book/show/[0-9]+' THEN 'goodreads_edition'
              WHEN host LIKE '%openlibrary.org' AND url ~ '/books/OL[0-9]+M' THEN 'open_library_edition'
              WHEN host LIKE '%google.%' AND url ~ '[?&]id=' THEN 'google_volume'
              WHEN host LIKE '%hardcover.app' THEN 'hardcover'
              WHEN host LIKE '%barnesandnoble.com' THEN 'barnes_and_noble'
              WHEN host LIKE '%fantasticfiction.com' THEN 'fantastic_fiction'
              WHEN host LIKE '%bookbub.com' THEN 'bookbub'
              WHEN host LIKE '%kobo.com' THEN 'kobo'
              WHEN host LIKE '%apple.com' THEN 'apple'
              WHEN host LIKE '%google.%' THEN 'google_other'
              ELSE 'other' END AS kind FROM refs)
          SELECT 'reference_pattern',kind,count(*),count(DISTINCT media_id) FROM kinds GROUP BY kind ORDER BY count(*) DESC;
          SELECT 'last_issue',coalesce(j.state,'no_job'),coalesce(j.failure_class,''),count(*)
          FROM (SELECT DISTINCT media_id FROM metadata_review.work_requests WHERE kind='retry' AND state='deferred') w
          LEFT JOIN LATERAL (SELECT state,failure_class FROM metadata_queue.jobs WHERE media_id=w.media_id ORDER BY id DESC LIMIT 1) j ON true
          GROUP BY 2,3 ORDER BY 4 DESC;
          SELECT 'flags',f.value,count(*) FROM metadata_review.work_requests w
          CROSS JOIN LATERAL jsonb_array_elements_text(coalesce(details->'flags','[]')) f
          WHERE w.kind='retry' AND w.state='deferred' GROUP BY 2 ORDER BY 3 DESC;
          COMMIT;
          SQL
          REMOTE
