name: Trace Term One cover
on:
  push:
    branches: [deploy/calibre-library-acceptance]
    paths: [.github/workflows/check-term-one-cover.yml]
permissions:
  contents: read
jobs:
  status:
    runs-on: [self-hosted, linux, x64, docker-build, chatgpt-build-02]
    timeout-minutes: 2
    steps:
      - name: Read aggregate retry readiness
        run: |
          set -euo pipefail
          test "$(hostname -s)" = chatgpt-build-02
          umask 077
          replay="$(mktemp)"
          trap 'rm -f "$replay"' EXIT
          cat > "$replay" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from collections import Counter
          from urllib.parse import urlsplit

          sys.path.insert(0, os.path.expanduser("~/.local/share/metadata-queue"))
          from metadata_queue_provider import (CACHE_REVISION, edition_ids, edition_match, identity,
                                               review_identifiers, work_identity)
          from metadata_queue_cover import allowed_cover

          catalog = {}
          cache = {}
          for line in sys.stdin:
              key, value = json.loads(line)
              if key == "cache":
                  cache[value["fingerprint"]] = value["payload"]
              else:
                  catalog[key] = value
          original = catalog["original"]
          refs = [{"review": row} for row in catalog["references"]]
          hints = review_identifiers(refs)
          print("recognized_hint_kinds", sorted(hints))
          for ref in refs:
              for entry in ref["review"].get("urls", []):
                  parsed = urlsplit(entry["normalized"])
                  if parsed.hostname in {"www.goodreads.com", "goodreads.com"}:
                      print("goodreads_link_shape", "catalog_book" if parsed.path.startswith("/book/show/") else
                            "localized_book" if "/book/show/" in parsed.path else "other")
          print("calibre_id_types", sorted({kind for kind, _ in edition_ids(original)}))
          endpoint = os.environ["METADATA_QUEUE_TEST_ENGINE"]
          for provider in ["goodreads", "open_library", "google_books"]:
              parts = [CACHE_REVISION, endpoint, provider, original] + ([hints] if hints else [])
              fingerprint = hashlib.sha256(json.dumps(parts,sort_keys=True).encode()).hexdigest()
              if fingerprint not in cache:
                  print(provider, "cache_key_not_found")
                  continue
              rows = cache[fingerprint]
              counts = Counter()
              for row in rows:
                  counts["rows"] += 1
                  counts["cover_urls"] += bool(row.get("cover_url"))
                  counts["allowed_covers"] += allowed_cover(row.get("cover_url"))
                  counts["work_match"] += work_identity(original, row)
                  counts["edition_match"] += edition_match(original, row, provider, hints)
                  counts["verified"] += identity(original, row, provider, hints)
                  counts["shared_but_title_or_author_rejected"] += edition_match(original, row, provider, hints) and not work_identity(original, row)
              print(provider, dict(counts))
          PY
          set -a
          source "$HOME/.config/metadata-queue/worker.env"
          set +a
          ssh -o BatchMode=yes -o ConnectTimeout=5 root@192.168.0.59 'file=$(mktemp); trap "rm -f -- $file" EXIT; cat > "$file"; bash "$file" </dev/null' <<'REMOTE' | "$HOME/.local/share/metadata-queue/python/bin/python" "$replay"
          set -euo pipefail
          source=""
          while read -r container; do
            if docker port "$container" 5432/tcp 2>/dev/null | grep -q ':5432$'; then
              test -z "$source"
              source="$container"
            fi
          done < <(docker ps --format '{{.ID}}')
          test -n "$source"
          db_user="$(docker exec "$source" sh -c 'printf "%s" "${POSTGRES_USER:-postgres}"')"
          docker exec -i "$source" psql -qXAt -v ON_ERROR_STOP=1 -U "$db_user" -d metadata_test <<'SQL'
          BEGIN READ ONLY;
          WITH b AS (SELECT id FROM metadata_queue.media WHERE display_title ILIKE 'F%ck You%Term One%')
          SELECT jsonb_build_array('original', v.payload) FROM b
          JOIN LATERAL (SELECT payload FROM metadata_queue.metadata_versions
            WHERE media_id=b.id AND source_name='calibre-original' ORDER BY id DESC LIMIT 1) v ON true;
          SELECT jsonb_build_array('references',coalesce(jsonb_agg(w.details),'[]'))
          FROM metadata_review.work_requests w
          JOIN metadata_queue.media b ON b.id=w.media_id
          WHERE b.display_title ILIKE 'F%ck You%Term One%' AND w.kind='retry';
          SELECT jsonb_build_array('cache',jsonb_build_object('fingerprint',fingerprint,'payload',payload))
          FROM metadata_queue.provider_cache;
          COMMIT;
          SQL
          REMOTE
