name: Local runner queue diagnostics
on:
  push:
    branches: [fix/verified-series-number-variants]
    paths: [.github/workflows/local-runner-diagnostics.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, calibre-controller, chatgpt-dev]
    timeout-minutes: 3
    steps:
      - name: Inspect local runner service states without configuration or credentials
        run: |
          test "$(hostname -s)" = chatgpt-dev
          python3 - <<'PY'
          import json
          import subprocess
          import urllib.request
          result = subprocess.run(["systemctl", "list-units", "--all", "--type=service", "--plain", "--no-legend", "--no-pager"], capture_output=True, text=True, check=True)
          services = []
          for line in result.stdout.splitlines():
              parts = line.split()
              if parts and "runner" in parts[0].lower():
                  services.append(parts[0])
          for service in services:
              state = subprocess.run(["systemctl", "show", service, "--property=ActiveState,SubState,NRestarts", "--no-pager"], capture_output=True, text=True, check=True)
              print(json.dumps({"service": service, "state": state.stdout.splitlines()}), flush=True)
          process = subprocess.run(["ps", "-eo", "pid,etimes,comm"], capture_output=True, text=True, check=True)
          print("\n".join(line for line in process.stdout.splitlines() if "Runner." in line), flush=True)
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({"https": "http://192.168.0.59:8118"}))
          with opener.open("https://api.github.com/", timeout=20) as response:
              print(json.dumps({"github_api_via_proxy_status": response.status}), flush=True)
          PY
