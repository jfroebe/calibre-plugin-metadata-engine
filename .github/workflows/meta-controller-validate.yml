env:
  http_proxy: http://192.168.0.59:8118
  https_proxy: http://192.168.0.59:8118
  no_proxy: localhost,127.0.0.1,::1,.localhost

name: Calibre validation

on:
  pull_request:
  push:
    branches: [main, 'test/calibre-*']
  workflow_dispatch:
    inputs:
      mode:
        description: CI, local integration, or full release qualification
        type: choice
        options: [ci, release]
        default: ci
  workflow_call:
    inputs:
      mode:
        type: string
        default: release

permissions:
  contents: read

concurrency:
  group: calibre-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: [self-hosted, linux, x64, calibre-controller, chatgpt-dev]
    timeout-minutes: 10
    outputs:
      engine: ${{ steps.pins.outputs.engine }}
      previous: ${{ steps.pins.outputs.previous }}
    steps:
      - name: Require approved Meta worker
        run: |
          test "$(hostname -s)" = chatgpt-dev
          test "$(id -un)" = agent
          test -S /var/run/docker.sock
      - uses: actions/checkout@v4
      - name: Isolate Python tools on the Meta worker
        run: |
          python3 -m venv "$RUNNER_TEMP/calibre-tools-$GITHUB_RUN_ID-$GITHUB_JOB-$GITHUB_RUN_ATTEMPT"
          echo "$RUNNER_TEMP/calibre-tools-$GITHUB_RUN_ID-$GITHUB_JOB-$GITHUB_RUN_ATTEMPT/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r ci/requirements.txt
      - run: python -m ruff check ci tests
      - run: python -m ruff format --check ci tests
      - run: python ci/unit_report.py --pattern test_package.py --report reports/package.xml
      - run: python ci/unit_report.py --pattern test_qualification.py --report reports/qualification.xml
      - run: python ci/unit_report.py --pattern test_runtime_harness.py --report reports/harness.xml
      - run: python ci/unit_report.py --pattern test_snapshot_gate.py --require-no-skips --report reports/snapshot.xml
      - run: python ci/unit_report.py --pattern test_release_gate.py --require-no-skips --report reports/release.xml
      - id: pins
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          pins = json.loads(Path('ci/compatibility.json').read_text())
          for item in pins['components'].values():
              if not re.fullmatch('[0-9a-f]{40}', item['sha']):
                  raise SystemExit('Every component must have an exact commit SHA')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('engine=' + pins['components']['engine']['sha'], file=output)
              print('previous=' + pins['components']['calibre_previous']['sha'], file=output)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: calibre-candidate-${{ github.sha }}
          path: Calibre-Metadata-Engine.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibre-packaging-report
          path: reports
          retention-days: 14

  native-runtime:
    needs: package
    # Windows 11/macOS acceptance is independent; automated runtime is Meta Linux.
    runs-on: [self-hosted, linux, x64, docker-build, chatgpt-build-02]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Require approved Meta worker
        run: |
          test "$(hostname -s)" = chatgpt-build-02
          test "$(id -un)" = agent
          test -S /var/run/docker.sock
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.package.outputs.previous }}
          path: previous
          persist-credentials: false
      - name: Isolate Python tools on the Meta worker
        run: |
          python3 -m venv "$RUNNER_TEMP/calibre-tools-$GITHUB_RUN_ID-$GITHUB_JOB-$GITHUB_RUN_ATTEMPT"
          echo "$RUNNER_TEMP/calibre-tools-$GITHUB_RUN_ID-$GITHUB_JOB-$GITHUB_RUN_ATTEMPT/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: calibre-candidate-${{ github.sha }}
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon0 libxinerama1
      - name: Verify and extract pinned official Calibre
        run: |
          python ci/install_calibre.py "$RUNNER_TEMP/calibre" > calibre-bin.txt
          python - <<'PY'
          import os
          from pathlib import Path
          binary = Path('calibre-bin.txt').read_text().strip()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              print('CALIBRE_TEST_BIN=' + binary, file=output)
          PY
      - name: Installed plugin, upgrade preferences and lifecycle
        run: |
          python ci/run_runtime.py --calibre-bin "$CALIBRE_TEST_BIN" \
            --zip Calibre-Metadata-Engine.zip \
            --previous-zip previous/Calibre-Metadata-Engine.zip \
            --report reports/native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibre-native-meta-linux
          path: reports
          retention-days: 14

  integration-evidence:
    needs: package
    runs-on: [self-hosted, linux, x64, calibre-controller, chatgpt-dev]
    timeout-minutes: 5
    steps:
      - name: Require approved Meta worker
        run: |
          test "$(hostname -s)" = chatgpt-dev
          test "$(id -un)" = agent
          test -S /var/run/docker.sock
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: calibre-candidate-${{ github.sha }}
      - name: Bind qualification to the exact tested ZIP and component pins
        run: python3 ci/release_gate.py

  qualification:
    needs: [package, native-runtime, integration-evidence]
    if: always()
    runs-on: [self-hosted, linux, x64, calibre-controller, chatgpt-dev]
    timeout-minutes: 2
    steps:
      - name: Require approved Meta worker
        run: |
          test "$(hostname -s)" = chatgpt-dev
          test "$(id -un)" = agent
          test -S /var/run/docker.sock
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require actual validation results
        env:
          RESULTS: ${{ toJSON(needs) }}
          QUALIFICATION_MODE: ${{ inputs.mode || 'ci' }}
        run: python3 ci/qualification.py
