name: META Controller Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meta-controller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Local GitHub test workers, including future VMs, use the web relay.
  http_proxy: http://192.168.0.59:8118
  https_proxy: http://192.168.0.59:8118
  all_proxy: http://192.168.0.59:8118
  no_proxy: localhost,127.0.0.1,::1,.localhost,meta-postgres

jobs:
  meta-validate:
    runs-on: [self-hosted, linux, x64, meta-controller]
    timeout-minutes: 10
    steps:
      - name: Configure local proxy aliases
        shell: bash
        run: |
          printf '%s\n' "HTTP_PROXY=$http_proxy" "HTTPS_PROXY=$https_proxy" \
            "ALL_PROXY=$all_proxy" "NO_PROXY=$no_proxy" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Verify Calibre plugin package sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import zipfile
          from pathlib import Path
          required = ['__init__.py','config.py','plugin-import-name-metadata_engine.txt','README.md']
          for name in required:
              if not Path(name).is_file():
                  raise SystemExit(f'missing {name}')
          for name in ('__init__.py','config.py'):
              ast.parse(Path(name).read_text(encoding='utf-8'),filename=name)
          output = Path('/tmp/meta-calibre-validation.zip')
          with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED) as z:
              for name in required:
                  z.write(name,name)
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None
          output.unlink()
          print('PASS: Calibre plugin source and temporary ZIP validation')
          PY
      - name: Preserve existing distribution build
        run: echo 'Published Calibre ZIP continues to be built by the existing build-plugin workflow.'
