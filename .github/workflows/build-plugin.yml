name: Build Calibre plugin

on:
  push:
    branches: [main]
    paths:
      - '__init__.py'
      - 'config.py'
      - 'plugin-import-name-metadata_engine.txt'
      - 'README.md'
      - 'ci/compatibility.json'
      - 'ci/release-evidence.json'
      - '.github/workflows/build-plugin.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calibre-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/meta-controller-validate.yml
    with:
      mode: release
  build:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: calibre-candidate-${{ github.sha }}
      - name: Verify qualified distribution without rebuilding it
        run: python3 ci/release_gate.py
      - name: Commit the exact installable ZIP that passed validation
        run: |
          if git diff --quiet -- Calibre-Metadata-Engine.zip && git ls-files --error-unmatch Calibre-Metadata-Engine.zip >/dev/null 2>&1; then
            echo 'Qualified plugin ZIP is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Calibre-Metadata-Engine.zip
          git commit -m 'Distribute qualified Calibre plugin ZIP'
          git push
