name: Build Calibre plugin

on:
  push:
    branches: [main]
    paths:
      - "__init__.py"
      - "config.py"
      - "plugin-import-name-metadata_engine.txt"
      - "README.md"
      - ".github/workflows/build-plugin.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source and documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import py_compile

          required = [Path("__init__.py"), Path("config.py"), Path("plugin-import-name-metadata_engine.txt"), Path("README.md")]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit(f"Missing required files: {missing}")

          for path in (Path("__init__.py"), Path("config.py")):
              py_compile.compile(str(path), doraise=True)

          conflict_markers = ("<<<<<<<", "=======", ">>>>>>>")
          for path in required:
              text = path.read_text(encoding="utf-8")
              if any(marker in text for marker in conflict_markers):
                  raise SystemExit(f"Merge-conflict marker found in {path}")
              if re.search(r"[ \t]+$", text, re.MULTILINE):
                  raise SystemExit(f"Trailing whitespace found in {path}")

          readme = Path("README.md").read_text(encoding="utf-8")
          if "\\n" in readme:
              raise SystemExit("README.md contains a literal \\n escape sequence")

          print("Source and documentation validation passed")
          PY

      - name: Build plugin ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          output = Path("Calibre-Metadata-Engine.zip")
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED) as zf:
              zf.write("__init__.py", "__init__.py")
              zf.write("config.py", "config.py")
              zf.write("plugin-import-name-metadata_engine.txt", "plugin-import-name-metadata_engine.txt")
              zf.write("README.md", "README.md")
          print(output, output.stat().st_size)
          PY

      - name: Commit installable ZIP
        run: |
          if git diff --quiet -- Calibre-Metadata-Engine.zip && git ls-files --error-unmatch Calibre-Metadata-Engine.zip >/dev/null 2>&1; then
            echo "Plugin ZIP is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Calibre-Metadata-Engine.zip
          git commit -m "Build Calibre plugin ZIP"
          git push
