name: Inspect restore progress
on:
  push:
    branches: [deploy/calibre-library-acceptance]
    paths: [.github/workflows/check-metadata-review-runner.yml]
permissions:
  contents: read
jobs:
  listener:
    runs-on: [self-hosted, linux, x64, calibre-controller, chatgpt-dev]
    timeout-minutes: 2
    steps:
      - name: Check runner listener and summarize connection state
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = chatgpt-dev
          ssh -o BatchMode=yes -o ConnectTimeout=5 root@192.168.0.59 'bash -s' <<'REMOTE'
          set -eu
          for dir in /mnt/user/database-backup/metadata_test/*-metadata-review-v1; do
            [ -d "$dir" ] || continue
            printf '%s\n' "${dir##*/}"
            for file in metadata_test.dump.partial metadata_test.dump metadata_test.dump.sha256 restore-verified.txt; do
              if [ -f "$dir/$file" ]; then stat -c "$file bytes=%s modified=%y" "$dir/$file"; fi
            done
          done
          while read -r container; do
            if docker port "$container" 5432/tcp 2>/dev/null | grep -q ':5432$'; then
              db_user="$(docker exec "$container" sh -c 'printf "%s" "${POSTGRES_USER:-postgres}"')"
              docker exec "$container" psql -qXAt -U "$db_user" -d metadata_test -c "SELECT 'review_schema',to_regnamespace('metadata_review') IS NOT NULL; SELECT datname,state,coalesce(wait_event_type,'running'),count(*) FROM pg_stat_activity WHERE datname LIKE 'metadata_review_restore_%' OR application_name='pg_dump' GROUP BY 1,2,3;"
              docker exec "$container" psql -qXAt -U "$db_user" -d metadata_test -c "SELECT 'restore_progress',p.command,p.type,p.bytes_processed,p.tuples_processed FROM pg_stat_progress_copy p JOIN pg_database d ON d.oid=p.datid WHERE d.datname LIKE 'metadata_review_restore_%';"
              df -h /mnt/user/database-backup/metadata_test | awk 'NR==2 {print "backup_free=" $4}'
            fi
          done < <(docker ps --format '{{.ID}}')
          REMOTE
