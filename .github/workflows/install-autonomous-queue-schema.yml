name: Install rehearsed schema in metadata_test
on:
  push:
    branches: [deploy/calibre-library-acceptance]
    paths: [.github/workflows/install-autonomous-queue-schema.yml]
permissions:
  contents: read
jobs:
  rehearse:
    runs-on: [self-hosted, linux, x64, docker-build, chatgpt-build-02]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rehearse and then install the additive schema
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = chatgpt-build-02
          {
            cat <<'REMOTE'
          set -euo pipefail
          backup=/mnt/user/database-backup/metadata_test/20261113T223903Z-queue-v2
          test -s "$backup/restore-verified.txt"
          (cd "$backup" && sha256sum -c SHA256SUMS)
          source=""
          while read -r container; do
            if docker port "$container" 5432/tcp 2>/dev/null | grep -q ':5432$'; then
              test -z "$source"
              source="$container"
            fi
          done < <(docker ps --format '{{.ID}}')
          image="$(docker inspect --format '{{.Image}}' "$source")"
          restore="$(docker run -d --network none --tmpfs /var/lib/postgresql --tmpfs /var/lib/postgresql/data -e PGDATA=/tmp/queue-postgres -e POSTGRES_HOST_AUTH_METHOD=trust "$image")"
          trap 'docker rm -f -v "$restore" >/dev/null' EXIT
          for i in $(seq 1 60); do
            if docker exec "$restore" pg_isready -q -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          docker exec "$restore" createdb -U postgres metadata_queue_restore_rehearsal
          docker exec -i "$restore" pg_restore --exit-on-error --single-transaction --no-owner --no-privileges -U postgres -d metadata_queue_restore_rehearsal < "$backup/metadata_test.dump"
          db() { docker exec -i "$restore" psql -X -v ON_ERROR_STOP=1 -U postgres -d metadata_queue_restore_rehearsal "$@"; }
          work="$(mktemp -d)"
          trap 'rm -rf "$work"; docker rm -f -v "$restore" >/dev/null' EXIT
          mkdir -m 700 "$work/sql"
          printf '%s' '' | base64 -d > "$work/sql/v1"
          printf '%s' '' | base64 -d > "$work/sql/v2"
          printf '%s' '' | base64 -d > "$work/sql/down"
          before="$(db -Atc 'SELECT count(*) FROM calibre_acceptance.attempts')"
          for phase in apply rollback reapply; do
            if [ "$phase" = rollback ]; then
              db --single-transaction < "$work/sql/down" >/dev/null
              test "$(db -Atc "SELECT to_regnamespace('metadata_queue') IS NULL")" = t
            else
              cat "$work/sql/v1" "$work/sql/v2" | db --single-transaction >/dev/null
              test "$(db -Atc 'SELECT max(revision) FROM metadata_queue.migrations')" = 2
            fi
            test "$(db -Atc 'SELECT count(*) FROM calibre_acceptance.attempts')" = "$before"
            printf '%s verified with %s preserved attempts\n' "$phase" "$before"
          done
          db_user="$(docker exec "$source" sh -c 'printf "%s" "${POSTGRES_USER:-postgres}"')"
          live() { docker exec -i "$source" psql -X -v ON_ERROR_STOP=1 -U "$db_user" -d metadata_test "$@"; }
          test "$(live -Atc 'SELECT count(*) FROM calibre_acceptance.attempts')" = "$before"
          digest="$(cut -d ' ' -f1 "$backup/metadata_test.dump.sha256")"
          {
            cat <<'SQL'
          SELECT pg_advisory_xact_lock(89411833);
          LOCK TABLE calibre_acceptance.attempts IN SHARE MODE;
          DO $
          BEGIN
            IF to_regnamespace('metadata_queue') IS NOT NULL THEN
              RAISE EXCEPTION 'metadata_queue schema already exists';
            END IF;
            IF (SELECT count(*) FROM calibre_acceptance.attempts) <> 160 THEN
              RAISE EXCEPTION 'acceptance history changed since backup';
            END IF;
          END
          $;
          SQL
            cat "$work/sql/v1" "$work/sql/v2"
            cat <<'SQL'
          INSERT INTO metadata_queue.historical_lookups (run_id,case_id,build,attempt,snapshot)
            SELECT run_id,case_id,build,attempt,to_jsonb(a) FROM calibre_acceptance.attempts a;
          SQL
            printf "INSERT INTO metadata_queue.migration_evidence (backup_sha256, prior_attempts) VALUES ('%s', %s);\n" "$digest" "$before"
          } | live --single-transaction >/dev/null
          live -Atc "SELECT 'Installed revisions',max(revision) FROM metadata_queue.migrations"
          live -Atc "SELECT 'Preserved attempts',count(*) FROM calibre_acceptance.attempts"
          live -Atc "SELECT 'Indexed attempts',count(*) FROM metadata_queue.historical_lookups"
          live -Atc "SELECT 'Real campaigns',count(*) FROM metadata_queue.campaigns WHERE NOT synthetic"
          REMOTE
          } | ssh -o BatchMode=yes root@192.168.0.59 'bash -s'
