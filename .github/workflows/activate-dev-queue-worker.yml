name: Activate and verify synthetic queue worker on chatgpt-dev
on:
  push:
    branches: [deploy/calibre-library-acceptance]
    paths: [.github/workflows/activate-dev-queue-worker.yml]
permissions:
  contents: read
jobs:
  install:
    runs-on: [self-hosted, linux, x64, calibre-controller, chatgpt-dev]
    timeout-minutes: 5
    steps:
      - name: Activate the previously installed synthetic worker
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(hostname -s)" = chatgpt-dev
          config="$HOME/.config/metadata-queue"
          base="$HOME/.local/share/metadata-queue"
          test -x "$base/python/bin/python"
          if [ ! -s "$config/pgpass" ]; then
            password="$(printf '%s' '' | base64 -d | openssl pkeyutl -decrypt -inkey "$config/worker-handoff.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256)"
            [[ "$password" =~ ^[a-f0-9]{64}$ ]]
            printf '192.168.0.59:5432:metadata_test:metadata_queue_chatgpt_dev:%s\n' "$password" > "$config/pgpass"
            unset password
          fi
          rm -f -- "$config/worker-handoff.pem"
          printf 'PGPASSFILE=%s\nMETADATA_QUEUE_DSN="host=192.168.0.59 port=5432 dbname=metadata_test user=metadata_queue_chatgpt_dev"\n' "$config/pgpass" > "$config/worker.env"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          if ! loginctl show-user "$(id -un)" --property=Linger --value | grep -qx yes; then
            loginctl enable-linger "$(id -un)" || sudo -n loginctl enable-linger "$(id -un)"
          fi
          systemctl --user daemon-reload
          if ! systemctl --user is-enabled --quiet metadata-queue-worker.service; then
            systemctl --user enable --now metadata-queue-worker.service
          fi
          systemctl --user is-active metadata-queue-worker.service
          systemctl --user show metadata-queue-worker.service -p MainPID -p NRestarts
