name: Audit review queue counts
on:
  push:
    branches: [deploy/calibre-library-acceptance]
    paths: [.github/workflows/audit-review-queue-counts.yml]
permissions:
  contents: read
jobs:
  status:
    runs-on: [self-hosted, linux, x64, docker-build, chatgpt-build-02]
    timeout-minutes: 2
    steps:
      - name: Read aggregate dashboard and campaign counts
        run: |
          set -euo pipefail
          test "$(hostname -s)" = chatgpt-build-02
          ssh -o BatchMode=yes -o ConnectTimeout=5 root@192.168.0.59 'file=$(mktemp); trap "rm -f -- $file" EXIT; cat > "$file"; bash "$file" </dev/null' <<'REMOTE'
          set -euo pipefail
          source=""
          while read -r container; do
            if docker port "$container" 5432/tcp 2>/dev/null | grep -q ':5432$'; then
              test -z "$source"
              source="$container"
            fi
          done < <(docker ps --format '{{.ID}}')
          test -n "$source"
          db_user="$(docker exec "$source" sh -c 'printf "%s" "${POSTGRES_USER:-postgres}"')"
          docker exec -i "$source" psql -qXAt -v ON_ERROR_STOP=1 -U "$db_user" -d metadata_test <<'SQL'
          BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY;
          SELECT 'as_of',statement_timestamp() AT TIME ZONE 'America/Detroit';
          SELECT 'queue',queue,count(*) FROM metadata_review.review_queue_history
          WHERE exited_at IS NULL GROUP BY queue ORDER BY queue;
          WITH recent AS (
              SELECT c.id,c.state,max(e.occurred_at) AS last_event
              FROM metadata_queue.campaigns c LEFT JOIN metadata_queue.campaign_events e ON e.campaign_id=c.id
              WHERE NOT c.synthetic GROUP BY c.id ORDER BY last_event DESC NULLS LAST LIMIT 5
          )
          SELECT 'campaign',r.id,r.state,j.state,count(j.id)
          FROM recent r LEFT JOIN metadata_queue.jobs j ON j.campaign_id=r.id
          GROUP BY r.id,r.state,r.last_event,j.state ORDER BY r.last_event DESC,j.state;
          SELECT 'active_jobs',count(*) FILTER (WHERE j.state='leased'),
                 count(*) FILTER (WHERE j.state='pending'),count(*) FILTER (WHERE j.state='retry_wait')
          FROM metadata_queue.jobs j JOIN metadata_queue.campaigns c ON c.id=j.campaign_id
          WHERE NOT c.synthetic AND c.state='running';
          SELECT 'runner',id,desired_state,observed_state,
                 round(extract(epoch FROM statement_timestamp()-heartbeat_at))
          FROM metadata_queue.runners WHERE id IN ('chatgpt-dev','chatgpt-build-02') ORDER BY id;
          SELECT 'feedback_attempts',count(*) FILTER (WHERE analysis->'review_feedback'->>'cohort'='reviewed'),
                 count(*) FILTER (WHERE analysis->'review_feedback'->>'cohort'='holdout'),
                 count(*) FILTER (WHERE analysis ? 'review_feedback')
          FROM metadata_queue.job_attempts;
          SELECT 'review_actions',decision,count(*) FROM metadata_review.review_decisions
          WHERE created_at>=timestamptz '2026-11-15 02:53:00+00' GROUP BY decision;
          SELECT 'feedback_result',campaign_id,cohort,policy,state,failure_class,books
          FROM metadata_review.feedback_campaign_results ORDER BY campaign_id,cohort,state;
          COMMIT;
          SQL
          REMOTE
