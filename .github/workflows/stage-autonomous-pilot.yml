name: Reconcile historical pilot and stage offline campaign
on:
  push:
    branches: [deploy/calibre-library-acceptance]
    paths: [.github/workflows/stage-autonomous-pilot.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: [self-hosted, linux, x64, docker-build, chatgpt-build-02]
    timeout-minutes: 10
    steps:
      - name: Import saved pilot versions and stage campaign in preparing
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(hostname -s)" = chatgpt-build-02
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s' '' | base64 -d > "$work/metadata_queue_import_pilot.py"
          printf '%s' '' | base64 -d > "$work/metadata_queue_quality.py"
          root="$HOME/.local/share/calibre-library-acceptance"
          state="$HOME/.local/state/calibre-library-acceptance/pilot-1"
          admin() {
            {
              cat <<'REMOTE'
          set -euo pipefail
          source=""
          while read -r container; do
            if docker port "$container" 5432/tcp 2>/dev/null | grep -q ':5432$'; then
              test -z "$source"
              source="$container"
            fi
          done < <(docker ps --format '{{.ID}}')
          test -n "$source"
          db_user="$(docker exec "$source" sh -c 'printf "%s" "${POSTGRES_USER:-postgres}"')"
          docker exec -i "$source" psql -qXAt -v ON_ERROR_STOP=1 -U "$db_user" -d metadata_test <<'SQL'
          REMOTE
              cat
              printf '\nSQL\n'
            } | ssh -o BatchMode=yes -o ConnectTimeout=5 root@192.168.0.59 'file=$(mktemp); trap "rm -f -- $file" EXIT; cat > "$file"; bash "$file" </dev/null'
          }
          revoke() {
            admin <<'SQL'
          REVOKE SELECT, INSERT ON metadata_queue.campaigns, metadata_queue.campaign_members FROM metadata_test;
          REVOKE EXECUTE ON FUNCTION metadata_queue.transition(uuid,bigint,uuid,metadata_queue.campaign_state,jsonb), metadata_queue.campaign_hash(uuid) FROM metadata_test;
          SQL
          }
          trap 'revoke; rm -rf "$work"' EXIT
          admin <<'SQL'
          GRANT SELECT, INSERT ON metadata_queue.campaigns, metadata_queue.campaign_members TO metadata_test;
          GRANT EXECUTE ON FUNCTION metadata_queue.transition(uuid,bigint,uuid,metadata_queue.campaign_state,jsonb), metadata_queue.campaign_hash(uuid) TO metadata_test;
          SQL
          export PGPASSFILE="$root/pgpass"
          export METADATA_QUEUE_DSN="host=192.168.0.59 port=5432 dbname=metadata_test user=metadata_test connect_timeout=5"
          "$root/current/python-env/bin/python" "$work/metadata_queue_import_pilot.py" --state "$state"
          admin <<'SQL'
          SELECT 'runner',id,desired_state,observed_state,heartbeat_at>now()-interval '15 seconds' FROM metadata_queue.runners ORDER BY id;
          SELECT 'versions',source_name,count(*) FROM metadata_queue.metadata_versions GROUP BY source_name;
          SELECT 'real_claims',count(*) FROM metadata_queue.jobs j JOIN metadata_queue.campaigns c ON c.id=j.campaign_id WHERE NOT c.synthetic AND j.attempt_count>0;
          SQL
