name: Install synthetic metadata queue workers
on:
  push:
    branches: [deploy/calibre-library-acceptance]
    paths: [.github/workflows/install-autonomous-synthetic-workers.yml]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: chatgpt-build-02, role: docker-build}
          - {host: chatgpt-dev, role: calibre-controller}
    runs-on: [self-hosted, linux, x64, '${{ matrix.role }}', '${{ matrix.host }}']
    timeout-minutes: 10
    env:
      EXPECTED_HOST: ${{ matrix.host }}
    steps:
      - name: Install worker and verify service and registration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(hostname -s)" = "$EXPECTED_HOST"
          test "$(id -un)" = agent
          base="$HOME/.local/share/metadata-queue"
          config="$HOME/.config/metadata-queue"
          install -d -m 700 "$base" "$config" "$HOME/.config/systemd/user"
          root="$HOME/.local/share/calibre-library-acceptance"
          test -x "$root/current/python-env/bin/python"
          ln -sfn "$(readlink -f "$root/current/python-env")" "$base/python"
          printf '%s' '' | base64 -d > "$base/metadata_queue_worker.py"
          printf '%s' '' | base64 -d > "$HOME/.config/systemd/user/metadata-queue-worker.service"
          role="metadata_queue_${EXPECTED_HOST//-/_}"
          password="$("$base/python/bin/python" -c 'from secrets import token_hex; print(token_hex(32))')"
          admin_ssh() {
            remote='work=$(mktemp); trap "rm -f -- $work" EXIT; cat > "$work"; bash "$work" </dev/null'
            if [ "$EXPECTED_HOST" = chatgpt-dev ]; then
              ssh -o BatchMode=yes -o ConnectTimeout=5 -J agent@192.168.0.25 root@192.168.0.59 "$remote"
            else
              ssh -o BatchMode=yes -o ConnectTimeout=5 root@192.168.0.59 "$remote"
            fi
          }
          admin() {
            {
              cat <<'REMOTE'
          set -euo pipefail
          source=""
          while read -r container; do
            if docker port "$container" 5432/tcp 2>/dev/null | grep -q ':5432$'; then
              test -z "$source"
              source="$container"
            fi
          done < <(docker ps --format '{{.ID}}')
          test -n "$source"
          db_user="$(docker exec "$source" sh -c 'printf "%s" "${POSTGRES_USER:-postgres}"')"
          docker exec -i "$source" psql -qX -v ON_ERROR_STOP=1 -U "$db_user" -d metadata_test <<'SQL'
          REMOTE
              cat
              printf '\nSQL\n'
            } | admin_ssh
          }
          if [ ! -f "$config/pgpass" ]; then
            {
              printf "BEGIN;\nSELECT pg_advisory_xact_lock(89411834);\n"
              printf "CREATE ROLE %s LOGIN PASSWORD '%s';\n" "$role" "$password"
              printf "GRANT CONNECT ON DATABASE metadata_test TO %s;\n" "$role"
              printf "GRANT USAGE ON SCHEMA metadata_queue TO %s;\n" "$role"
              printf "GRANT EXECUTE ON FUNCTION metadata_queue.heartbeat(text), metadata_queue.claim(text), metadata_queue.recover(text), metadata_queue.renew(text,bigint,uuid), metadata_queue.finish(text,bigint,uuid,text,text) TO %s;\n" "$role"
              printf "INSERT INTO metadata_queue.runners(id,host,desired_state) VALUES ('%s','%s','running') ON CONFLICT DO NOTHING;\n" "$EXPECTED_HOST" "$EXPECTED_HOST"
              printf "INSERT INTO metadata_queue.worker_accounts VALUES ('%s','%s') ON CONFLICT DO NOTHING;\nCOMMIT;\n" "$EXPECTED_HOST" "$role"
            } | admin >/dev/null 2>&1 || { printf '%s\n' 'Database role provisioning failed'; exit 1; }
            printf '192.168.0.59:5432:metadata_test:%s:%s\n' "$role" "$password" > "$config/pgpass"
          fi
          unset password
          printf 'PGPASSFILE=%s\nMETADATA_QUEUE_DSN="host=192.168.0.59 port=5432 dbname=metadata_test user=%s"\n' "$config/pgpass" "$role" > "$config/worker.env"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          if ! loginctl show-user "$USER" --property=Linger --value | grep -qx yes; then
            loginctl enable-linger "$USER" || sudo -n loginctl enable-linger "$USER"
          fi
          systemctl --user daemon-reload
          if ! systemctl --user is-enabled --quiet metadata-queue-worker.service; then
            systemctl --user enable --now metadata-queue-worker.service
          fi
          systemctl --user is-active metadata-queue-worker.service
          sleep 4
          printf "SELECT id,desired_state,observed_state,heartbeat_at IS NOT NULL FROM metadata_queue.runners WHERE id='%s';\n" "$EXPECTED_HOST" | admin
