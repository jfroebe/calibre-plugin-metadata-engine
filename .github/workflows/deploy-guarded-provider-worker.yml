name: Deploy fenced provider plumbing with real claims disabled
on:
  push:
    branches: [deploy/calibre-library-acceptance]
    paths: [.github/workflows/deploy-guarded-provider-worker.yml]
permissions:
  contents: read
jobs:
  migrate:
    runs-on: [self-hosted, linux, x64, docker-build, chatgpt-build-02]
    timeout-minutes: 90
    steps:
      - name: Back up current schema and apply guarded additive revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = chatgpt-build-02
          ssh -o BatchMode=yes -o ConnectTimeout=5 root@192.168.0.59 'file=$(mktemp); trap "rm -f -- $file" EXIT; cat > "$file"; bash "$file" </dev/null' <<'REMOTE'
          set -euo pipefail
          umask 077
          source=""
          while read -r container; do
            if docker port "$container" 5432/tcp 2>/dev/null | grep -q ':5432$'; then
              test -z "$source"
              source="$container"
            fi
          done < <(docker ps --format '{{.ID}}')
          test -n "$source"
          db_user="$(docker exec "$source" sh -c 'printf "%s" "${POSTGRES_USER:-postgres}"')"
          db() { docker exec -i "$source" psql -qXAt -v ON_ERROR_STOP=1 -U "$db_user" -d metadata_test "$@"; }
          test "$(db -c 'SELECT max(revision) FROM metadata_queue.migrations')" = 3
          backup="/mnt/user/database-backup/metadata_test/$(date -u +%Y%m%dT%H%M%SZ)-queue-v5"
          install -d -m 700 "$backup"
          printf 'Starting full test database backup at %s\n' "$backup"
          docker exec "$source" pg_dump -w -U "$db_user" -d metadata_test -Fc -Z 1 > "$backup/metadata_test.dump"
          docker exec "$source" pg_dump -w -U "$db_user" -d metadata_test --schema-only > "$backup/metadata_test.schema.sql"
          (cd "$backup" && sha256sum metadata_test.dump metadata_test.schema.sql > SHA256SUMS && sha256sum -c SHA256SUMS)
          docker exec -i "$source" pg_restore -l < "$backup/metadata_test.dump" > "$backup/archive-contents.txt"
          printf 'Backup checksum verified at %s\n' "$backup"
          image="$(docker inspect --format '{{.Image}}' "$source")"
          restored="$(docker run -d --network none -e PGDATA=/tmp/metadata-restore -e POSTGRES_HOST_AUTH_METHOD=trust "$image")"
          trap 'docker rm -f -v "$restored" >/dev/null; rm -f -- "$0"' EXIT
          for attempt in $(seq 1 60); do
            if docker exec "$restored" pg_isready -q -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          docker exec "$restored" createdb -U postgres metadata_queue_restore_rehearsal
          restore() { docker exec -i "$restored" psql -qXAt -v ON_ERROR_STOP=1 -U postgres -d metadata_queue_restore_rehearsal "$@"; }
          printf 'Restoring the backup into an isolated PostgreSQL container.\n'
          docker exec -i "$restored" pg_restore --exit-on-error --no-owner --no-privileges -U postgres -d metadata_queue_restore_rehearsal < "$backup/metadata_test.dump"
          for table in calibre_acceptance.attempts metadata_queue.artifacts metadata_queue.manifest_revisions; do
            query="SELECT count(*) FROM $table"
            test "$(restore -c "$query")" = "$(db -c "$query")"
            printf '%s restore verified\n' "$table" >> "$backup/restore-verified.txt"
          done
          printf 'Restore verified at %s\n' "$backup"
          {
            printf '%s\n' 'SELECT pg_advisory_xact_lock(89411833);'
            printf '%s' '' | base64 -d
            printf '%s' '' | base64 -d
            cat <<'SQL'
          GRANT EXECUTE ON FUNCTION metadata_queue.lookup_input(text,bigint,uuid),
            metadata_queue.finish_lookup(text,bigint,uuid,text,text,jsonb,jsonb),
            metadata_queue.reserve_provider(text,bigint,uuid,text),
            metadata_queue.read_provider_cache(text,bigint,uuid,text,text),
            metadata_queue.write_provider_cache(text,bigint,uuid,text,text,jsonb)
          TO metadata_queue_chatgpt_dev,metadata_queue_chatgpt_build_02;
          SQL
          } | db --single-transaction
          db -c "SELECT 'schema_revision',max(revision) FROM metadata_queue.migrations"
          db -c "SELECT 'real_campaign',state FROM metadata_queue.campaigns WHERE NOT synthetic"
          db -c "SELECT 'real_claims',count(*) FROM metadata_queue.jobs j JOIN metadata_queue.campaigns c ON c.id=j.campaign_id WHERE NOT c.synthetic AND j.attempt_count>0"
          REMOTE
  workers:
    needs: migrate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: chatgpt-build-02, role: docker-build}
          - {host: chatgpt-dev, role: calibre-controller}
    runs-on: [self-hosted, linux, x64, '${{ matrix.role }}', '${{ matrix.host }}']
    timeout-minutes: 5
    env:
      EXPECTED_HOST: ${{ matrix.host }}
    steps:
      - name: Update running test workers and verify service state
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(hostname -s)" = "$EXPECTED_HOST"
          base="$HOME/.local/share/metadata-queue"
          config="$HOME/.config/metadata-queue"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          if ! systemctl --user is-active --quiet metadata-queue-worker.service; then
            printf '%s\n' 'Existing worker is stopped. Leaving its service state in place.'
            exit 1
          fi
          if ! (
            set -a
            source "$config/worker.env"
            set +a
            "$base/python/bin/python" - "$EXPECTED_HOST" <<'PY'
          import os
          import sys
          import psycopg
          with psycopg.connect(os.environ["METADATA_QUEUE_DSN"], connect_timeout=5) as db:
              allowed = db.execute("SELECT metadata_queue.heartbeat(%s)", (sys.argv[1],)).fetchone()[0]
              raise SystemExit(0 if allowed else 1)
          PY
          ); then
            printf '%s\n' 'Database does not permit this worker to run.'
            exit 1
          fi
          printf '%s' '' | base64 -d > "$base/metadata_queue_worker.py.new"
          mv -f -- "$base/metadata_queue_worker.py.new" "$base/metadata_queue_worker.py"
          printf '%s' '' | base64 -d > "$base/metadata_queue_provider.py.new"
          mv -f -- "$base/metadata_queue_provider.py.new" "$base/metadata_queue_provider.py"
          printf '%s' '' | base64 -d > "$base/metadata_queue_quality.py.new"
          mv -f -- "$base/metadata_queue_quality.py.new" "$base/metadata_queue_quality.py"
          if ! grep -q '^METADATA_QUEUE_TEST_ENGINE=' "$config/worker.env"; then
            printf '%s\n' 'METADATA_QUEUE_TEST_ENGINE=http://192.168.0.59:14000' >> "$config/worker.env"
          fi
          systemctl --user try-restart metadata-queue-worker.service
          systemctl --user is-active metadata-queue-worker.service
