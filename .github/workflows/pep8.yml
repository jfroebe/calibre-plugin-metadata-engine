env:
  http_proxy: http://192.168.0.59:8118
  https_proxy: http://192.168.0.59:8118
  no_proxy: localhost,127.0.0.1,::1,.localhost

name: Python style

on:
  pull_request:
  push:
    branches: [main, 'release/**', 'maintenance/**']

permissions:
  contents: read

concurrency:
  group: python-style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pep8:
    runs-on: [self-hosted, linux, x64, calibre-controller, chatgpt-dev]
    timeout-minutes: 10
    steps:
      - name: Require approved Meta worker
        run: |
          test "$(hostname -s)" = chatgpt-dev
          test "$(id -un)" = agent
          test -S /var/run/docker.sock
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolate Python tools on the Meta worker
        run: |
          python3 -m venv "$RUNNER_TEMP/calibre-tools-$GITHUB_RUN_ID-$GITHUB_JOB-$GITHUB_RUN_ATTEMPT"
          echo "$RUNNER_TEMP/calibre-tools-$GITHUB_RUN_ID-$GITHUB_JOB-$GITHUB_RUN_ATTEMPT/bin" >> "$GITHUB_PATH"
      - name: Install pinned style tools
        run: python -m pip install --disable-pip-version-check -r requirements-style.txt
      - name: Check Python style and PEP 257 docstrings
        shell: bash
        run: |
          mkdir -p reports/style
          status=0
          python -m ruff check . --output-format json > reports/style/ruff.json || status=$?
          cat reports/style/ruff.json
          exit "$status"
      - name: Verify missing docstrings fail enforcement
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/pep257-probe.py"
          trap 'rm -f "$probe"' EXIT
          printf 'def public_contract():\n    return None\n' > "$probe"
          set +e
          python -m ruff check --config ruff.toml --select D "$probe"
          result=$?
          set -e
          test "$result" -eq 1
      - name: Check Python formatting
        run: python -m ruff format --check .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-style-${{ github.sha }}
          path: reports/style
          if-no-files-found: error
