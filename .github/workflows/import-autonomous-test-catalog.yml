name: Import offline Calibre records into metadata_test
on:
  push:
    branches: [deploy/calibre-library-acceptance]
    paths: [.github/workflows/import-autonomous-test-catalog.yml]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: [self-hosted, linux, x64, docker-build, chatgpt-build-02]
    timeout-minutes: 180
    env:
      http_proxy: http://192.168.0.59:8118
      https_proxy: http://192.168.0.59:8118
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Import the local Calibre snapshot and saved covers
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = chatgpt-build-02
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          root="$HOME/.local/share/calibre-library-acceptance"
          python="$root/current/python-env/bin/python"
          "$python" -m pip install --disable-pip-version-check 'Pillow>=11,<13'
          printf '%s' '' | base64 -d > "$work/metadata_queue_catalog.py"
          printf '%s' '' | base64 -d > "$work/metadata_queue_quality.py"
          mount="$("$python" - <<'PY'
          import contextlib
          import sys

          sys.path.insert(0, "ci")
          from prepare_library_acceptance import library_mount

          with contextlib.redirect_stdout(sys.stderr):
              root = library_mount()
          print(root)
          PY
          )"
          snapshot="$HOME/.local/state/calibre-library-acceptance/pilot-1/metadata.db"
          test -r "$snapshot"
          export METADATA_QUEUE_DSN="host=192.168.0.59 port=5432 dbname=metadata_test user=metadata_test connect_timeout=5"
          export PGPASSFILE="$root/pgpass"
          ssh -o BatchMode=yes root@192.168.0.59 'bash -s' <<'REMOTE'
          set -euo pipefail
          source=""
          while read -r container; do
            if docker port "$container" 5432/tcp 2>/dev/null | grep -q ':5432 --snapshot "$snapshot" --books "$mount" --library-id unraid-main
; then
              test -z "$source"
              source="$container"
            fi
          done < <(docker ps --format '{{.ID}}')
          test -n "$source"
          db_user="$(docker exec "$source" sh -c 'printf "%s" "${POSTGRES_USER:-postgres}"')"
          docker exec -i "$source" psql -X -v ON_ERROR_STOP=1 -U "$db_user" -d metadata_test <<'SQL'
          GRANT USAGE ON SCHEMA metadata_queue TO metadata_test;
          GRANT SELECT, INSERT, UPDATE ON metadata_queue.media, metadata_queue.works TO metadata_test;
          GRANT SELECT, INSERT ON metadata_queue.metadata_versions, metadata_queue.identifiers, metadata_queue.artifacts TO metadata_test;
          GRANT USAGE ON SEQUENCE metadata_queue.media_id_seq, metadata_queue.works_id_seq, metadata_queue.metadata_versions_id_seq, metadata_queue.artifacts_id_seq TO metadata_test;
          SQL
          REMOTE
          "$python" "$work/metadata_queue_catalog.py" --snapshot "$snapshot" --books "$mount" --library-id unraid-main
