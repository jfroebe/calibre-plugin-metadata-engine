name: Freeze offline campaign evidence
on:
  push:
    branches: [deploy/calibre-library-acceptance]
    paths: [.github/workflows/freeze-autonomous-pilot-evidence.yml]
permissions:
  contents: read
jobs:
  freeze:
    runs-on: [self-hosted, linux, x64, docker-build, chatgpt-build-02]
    timeout-minutes: 5
    steps:
      - name: Store the prepared manifest and historical failure evidence
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(hostname -s)" = chatgpt-build-02
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          printf '%s' '' | base64 -d > "$work/up.sql"
          printf '%s' '' | base64 -d > "$work/down.sql"
          printf '%s' '' | base64 -d > "$work/collect.py"
          python3 "$work/collect.py" --directory "$HOME/.local/state/calibre-library-acceptance/pilot-1/runs/pilot/diagnostics" > "$work/evidence.json"
          {
            cat <<'REMOTE'
          set -euo pipefail
          source=""
          while read -r container; do
            if docker port "$container" 5432/tcp 2>/dev/null | grep -q ':5432$'; then
              test -z "$source"
              source="$container"
            fi
          done < <(docker ps --format '{{.ID}}')
          test -n "$source"
          db_user="$(docker exec "$source" sh -c 'printf "%s" "${POSTGRES_USER:-postgres}"')"
          docker exec -i "$source" psql -qXAt --single-transaction -v ON_ERROR_STOP=1 -U "$db_user" -d metadata_test <<'SQL'
          SELECT pg_advisory_xact_lock(89411833);
          SELECT NOT EXISTS (SELECT FROM metadata_queue.migrations WHERE revision=3) AS needs_migration \gset
          \if :needs_migration
          REMOTE
            cat "$work/up.sql"
            printf '\n\\endif\n'
            cat <<'SQL'
          SELECT metadata_queue.freeze_manifest('72b07fe2-86a0-4a69-aa2d-3cc22362f923',1);
          CREATE TEMP TABLE prior_evidence (value text);
          COPY prior_evidence FROM STDIN;
          SQL
            sed 's/\\/\\\\/g' "$work/evidence.json"
            printf '\\.\n'
            cat <<'SQL'
          INSERT INTO metadata_queue.historical_diagnostics (campaign_id,case_id,evidence)
          SELECT '72b07fe2-86a0-4a69-aa2d-3cc22362f923', entry->>'case_id',entry->'evidence'
          FROM prior_evidence e CROSS JOIN LATERAL jsonb_array_elements(e.value::jsonb) entry
          ON CONFLICT DO NOTHING;
          SELECT 'manifest',campaign_id,campaign_version,jsonb_array_length(members),manifest_hash,config_hash
          FROM metadata_queue.manifest_revisions;
          SELECT 'diagnostics',count(*) FROM metadata_queue.historical_diagnostics;
          SELECT 'real_campaign',state FROM metadata_queue.campaigns WHERE id='72b07fe2-86a0-4a69-aa2d-3cc22362f923';
          SQL
            printf '\nSQL\n'
          } | ssh -o BatchMode=yes -o ConnectTimeout=5 root@192.168.0.59 'script=$(mktemp); trap "rm -f -- $script" EXIT; cat > "$script"; bash "$script" </dev/null'
