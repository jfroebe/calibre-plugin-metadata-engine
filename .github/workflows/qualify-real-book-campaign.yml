name: Qualify the real-book test campaign without starting it
on:
  push:
    branches: [deploy/calibre-library-acceptance]
    paths: [.github/workflows/qualify-real-book-campaign.yml]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: [self-hosted, linux, x64, docker-build, chatgpt-build-02]
    timeout-minutes: 10
    steps:
      - name: Check live prerequisites and advance only to ready
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(hostname -s)" = chatgpt-build-02
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s' '' | base64 -d > "$work/prepare.py"
          cat > "$work/evidence.json" <<'EVIDENCE'
          {"reference":"Reconciled 40-book test campaign. Synthetic qualification and restored full backup verified.","checks":{"migration":"https://github.com/jfroebe/calibre-plugin-metadata-engine/actions/runs/43539236247","backup":"https://github.com/jfroebe/calibre-plugin-metadata-engine/actions/runs/43536149792","rollback":"https://github.com/jfroebe/metadata-engine/actions/runs/43538316763","history":"https://github.com/jfroebe/calibre-plugin-metadata-engine/actions/runs/43521622067","catalog":"https://github.com/jfroebe/calibre-plugin-metadata-engine/actions/runs/43527865258","manifest":"https://github.com/jfroebe/calibre-plugin-metadata-engine/actions/runs/43528381553","storage":"https://github.com/jfroebe/metadata-engine/actions/runs/43538316763","quality":"https://github.com/jfroebe/calibre-plugin-metadata-engine/actions/runs/43528151328","leasing":"https://github.com/jfroebe/metadata-engine/actions/runs/43538316763","fencing":"https://github.com/jfroebe/metadata-engine/actions/runs/43538316763","user_stop":"https://github.com/jfroebe/metadata-engine/actions/runs/43538316763","provider_limits":"https://github.com/jfroebe/metadata-engine/actions/runs/43538316763","readonly_library":"https://github.com/jfroebe/calibre-plugin-metadata-engine/actions/runs/43521904424","workload_limits":"https://github.com/jfroebe/metadata-engine/actions/runs/43538316763","authorization":"https://github.com/jfroebe/metadata-engine/actions/runs/43538316763"},"providers":{"goodreads":1500,"open_library":1500,"google_books":1500}}
          EVIDENCE
          curl --noproxy '*' -fsS --max-time 10 http://192.168.0.59:14000/health >/dev/null
          curl --noproxy '*' -fsS --max-time 10 http://192.168.0.59:14000/plugins > "$work/plugins.json"
          python3 - "$work/plugins.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text())
          rows = data.get("plugins", []) if isinstance(data, dict) else data
          enabled = set()
          for row in rows:
              if isinstance(row, str):
                  enabled.add(row)
              elif isinstance(row, dict) and row.get("enabled", True):
                  enabled.update(row.get(key) for key in ("name", "id", "plugin_id"))
          expected = {"goodreads", "open_library", "google_books"}
          if not expected <= enabled:
              raise SystemExit("Missing enabled providers: " + ", ".join(sorted(expected - enabled)))
          print("Provider discovery verified without book lookups")
          PY
          admin() {
            {
              cat <<'REMOTE'
          set -euo pipefail
          source=""
          while read -r container; do
            if docker port "$container" 5432/tcp 2>/dev/null | grep -q ':5432$'; then
              test -z "$source"
              source="$container"
            fi
          done < <(docker ps --format '{{.ID}}')
          test -n "$source"
          db_user="$(docker exec "$source" sh -c 'printf "%s" "${POSTGRES_USER:-postgres}"')"
          docker exec -i "$source" psql -qXAt -v ON_ERROR_STOP=1 -U "$db_user" -d metadata_test <<'SQL'
          REMOTE
              cat
              printf '\nSQL\n'
            } | ssh -o BatchMode=yes -o ConnectTimeout=5 root@192.168.0.59 'file=$(mktemp); trap "rm -f -- $file" EXIT; cat > "$file"; bash "$file" </dev/null'
          }
          revoke() {
            admin <<'SQL'
          REVOKE SELECT ON metadata_queue.migrations,metadata_queue.runners,metadata_queue.campaigns,metadata_queue.campaign_members,metadata_queue.manifest_revisions FROM metadata_test;
          REVOKE UPDATE (config,version) ON metadata_queue.campaigns FROM metadata_test;
          REVOKE INSERT ON metadata_queue.manifest_revisions FROM metadata_test;
          REVOKE EXECUTE ON FUNCTION metadata_queue.transition(uuid,bigint,uuid,metadata_queue.campaign_state,jsonb),metadata_queue.freeze_manifest(uuid,bigint),metadata_queue.campaign_hash(uuid) FROM metadata_test;
          SQL
          }
          trap 'revoke; rm -rf "$work"' EXIT
          admin <<'SQL'
          GRANT SELECT ON metadata_queue.migrations,metadata_queue.runners,metadata_queue.campaigns,metadata_queue.campaign_members,metadata_queue.manifest_revisions TO metadata_test;
          GRANT UPDATE (config,version) ON metadata_queue.campaigns TO metadata_test;
          GRANT INSERT ON metadata_queue.manifest_revisions TO metadata_test;
          GRANT EXECUTE ON FUNCTION metadata_queue.transition(uuid,bigint,uuid,metadata_queue.campaign_state,jsonb),metadata_queue.freeze_manifest(uuid,bigint),metadata_queue.campaign_hash(uuid) TO metadata_test;
          SQL
          root="$HOME/.local/share/calibre-library-acceptance"
          export PGPASSFILE="$root/pgpass"
          export METADATA_QUEUE_DSN="host=192.168.0.59 port=5432 dbname=metadata_test user=metadata_test connect_timeout=5"
          "$root/current/python-env/bin/python" "$work/prepare.py" 72b07fe2-86a0-4a69-aa2d-3cc22362f923 --evidence "$work/evidence.json"
          admin <<'SQL'
          SELECT 'real_jobs',state,count(*) FROM metadata_queue.jobs j
          WHERE campaign_id='72b07fe2-86a0-4a69-aa2d-3cc22362f923' GROUP BY state;
          SELECT 'real_approvals',count(*) FROM metadata_queue.campaign_approvals
          WHERE campaign_id='72b07fe2-86a0-4a69-aa2d-3cc22362f923';
          SQL
